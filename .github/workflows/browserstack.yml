name: Browserstack Firefox diagnostics

on:
  push:
    branches:
      - mgol-tmp-firefox-test

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  test:
    runs-on: ubuntu-latest
    environment: browserstack
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      NODE_VERSION: 24.x
    name: ${{ matrix.BROWSER }}
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.BROWSER }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        BROWSER:
          - 'Firefox_155_Windows_11'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Patch installed jquery-test-runner for Local logging
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync, writeFileSync } from "node:fs";

          const path = "node_modules/jquery-test-runner/browserstack/local.js";
          const source = readFileSync( path, "utf8" );
          const anchor = '"enable-logging-for-api": "",';
          assert.equal( source.split( anchor ).length, 2, "Unexpected runner source" );
          writeFileSync( path, source.replace( anchor,
            `${ anchor }\n\t\t\t\tverbose: 3,\n\t\t\t\tlogFile: "local.log",`
          ) );
          NODE

      - name: Build jQuery
        run: npm run build:all

      - name: Pretest script
        run: npm run pretest

      - name: Run tests
        # Leave time for diagnostics upload if the runner hangs.
        timeout-minutes: 25
        run: |
          npm run test:unit -- -v -c jtr-isolate.yml \
            --browserstack "${{ matrix.BROWSER }}" \
            --run-id ${{ github.run_id }}

      - name: Collect BrowserStack version and run details
        if: always()
        env:
          BROWSER: ${{ matrix.BROWSER }}
        run: |
          mkdir -p tmp
          {
            echo "GitHub run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Attempt: $GITHUB_RUN_ATTEMPT"
            echo "Commit: $GITHUB_SHA"
            echo "Browser: $BROWSER"
            npm ls jquery-test-runner browserstack-local || true
            for binary in "$HOME/.browserstack/BrowserStackLocal" "$PWD/BrowserStackLocal" "${TMPDIR:-/tmp}/BrowserStackLocal"; do
              if [ -x "$binary" ]; then
                "$binary" --version
                break
              fi
            done
          } > tmp/browserstack-info.txt 2>&1
          cat tmp/browserstack-info.txt

      - name: Upload BrowserStack diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browserstack-${{ matrix.BROWSER }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            local.log
            tmp/browserstack-info.txt
          retention-days: 14
